<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zona Gamer - Carrito</title>

<link rel="stylesheet" href="css/styleCarrito.css">
</head>

<body>

<button class="theme-btn" onclick="toggleTheme()">🌙</button>

<header>
    <div>
        <h1>🎮 Zona Gamer</h1>
        <span class="alumno">Javier Somosa</span>
    </div>
    <nav>
        <a href="productos.html">Productos</a>
        <a href="carrito.html">Carrito</a>
        <a href="index.html">Salir</a>
    </nav>
</header>

<div class="contenedor">
    <h2>🛒 Carrito</h2>

    <div id="carrito" class="lista-carrito"></div>

    <h3 id="total" class="total"></h3>

    <div class="acciones">
        <button class="btn-finalizar" onclick="finalizar()">Finalizar compra</button>
        <a href="productos.html" class="volver">← Volver</a>
    </div>
</div>

<!-- modal confirmar compra -->
<div id="modalConfirmar" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;">
    <div style="background:white;padding:25px;border-radius:12px;text-align:center;max-width:320px;margin:auto;margin-top:25vh;">
        <p id="modalTexto" style="margin-bottom:15px;font-size:16px;"></p>
        <button id="modalSi" style="padding:8px 16px;background:#28a745;color:white;border:none;border-radius:8px;cursor:pointer;margin-right:10px;">Sí</button>
        <button id="modalNo" style="padding:8px 16px;background:#ddd;color:#333;border:none;border-radius:8px;cursor:pointer;">Cancelar</button>
    </div>
</div>

<!-- modal aviso -->
<div id="modalAviso" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;">
    <div style="background:white;padding:25px;border-radius:12px;text-align:center;max-width:300px;margin:auto;margin-top:25vh;">
        <p id="modalAvisoTexto" style="margin-bottom:15px;font-size:16px;"></p>
        <button onclick="document.getElementById('modalAviso').style.display='none'" style="padding:8px 16px;background:#6c63ff;color:white;border:none;border-radius:8px;cursor:pointer;">Aceptar</button>
    </div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

function render() {
    const contenedor = document.getElementById("carrito");
    contenedor.innerHTML = "";
    let total = 0;

    carrito.forEach(p => {
        total += p.precio * p.cantidad;

        contenedor.innerHTML += `
            <div class="item">
                <span>${p.nombre} x${p.cantidad}</span>
                <div>
                    <button onclick="sumar(${p.id})">+</button>
                    <button onclick="restar(${p.id})">-</button>
                </div>
            </div>
        `;
    });

    document.getElementById("total").innerText = "Total: $" + total;
}

function sumar(id) {
    carrito.find(p => p.id === id).cantidad++;
    guardar();
}

function restar(id) {
    const prod = carrito.find(p => p.id === id);
    prod.cantidad--;
    if (prod.cantidad <= 0)
        carrito = carrito.filter(p => p.id !== id);
    guardar();
}

function guardar() {
    localStorage.setItem("carrito", JSON.stringify(carrito));
    render();
}

function mostrarAviso(texto) {
    document.getElementById("modalAvisoTexto").textContent = texto;
    document.getElementById("modalAviso").style.display = "flex";
}

function finalizar() {
    if (carrito.length === 0) {
        mostrarAviso("El carrito está vacío");
        return;
    }
    document.getElementById("modalTexto").textContent = "¿Confirmar compra?";
    document.getElementById("modalConfirmar").style.display = "flex";
}

document.getElementById("modalNo").addEventListener("click", function() {
    document.getElementById("modalConfirmar").style.display = "none";
});

document.getElementById("modalSi").addEventListener("click", async function() {
    document.getElementById("modalConfirmar").style.display = "none";

    const nombre = localStorage.getItem("nombreUsuario");

    const res = await fetch("/api/ventas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nombre_cliente: nombre,
            productos: carrito.map(p => ({
                id: p.id,
                cantidad: p.cantidad
            }))
        })
    });

    if (!res.ok) {
        mostrarAviso("Error al crear la venta");
        return;
    }

    const data = await res.json();

    localStorage.removeItem("carrito");
    localStorage.setItem("ticket", JSON.stringify(data.venta));
    window.location.href = "ticket.html";
});

function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("tema",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

window.onload = function () {
    if (localStorage.getItem("tema") === "dark") {
        document.body.classList.add("dark");
    }
    render();
};
</script>

</body>
</html>

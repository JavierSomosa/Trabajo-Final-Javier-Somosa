<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zona Gamer - Detalle</title>

<link rel="stylesheet" href="css/styleDetalle.css">
</head>

<body>

<button class="theme-btn" onclick="toggleTheme()">🌙</button>

<header>
    <div>
        <h1>🎮 Zona Gamer</h1>
        <span class="alumno">Javier Somosa</span>
    </div>
    <nav>
        <a href="productos.html">Productos</a>
        <a href="carrito.html">Carrito</a>
        <a href="index.html">Salir</a>
    </nav>
</header>

<div class="contenedor">
    <h2>Detalle del Producto</h2>

    <div id="detalle" class="card-detalle"></div>

    <a class="volver" href="productos.html">← Volver a productos</a>
</div>

<script src="js/detalle.js"></script>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("tema",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

window.onload = function () {
    if (localStorage.getItem("tema") === "dark") {
        document.body.classList.add("dark");
    }
};
</script>

</body>
</html>
